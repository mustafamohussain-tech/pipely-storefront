<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipely — متجر أحمد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5fb;--card:#fff;--line:#e7e1f2;
    --accent:#7c5cff;--accent-dark:#5f3fe0;--accent-glow:rgba(124,92,255,.25);
    --amber:#e0932e;--green:#1f9d54;--danger:#d63d33;
    --text:#241f38;--text-dim:#6b6480;--text-mute:#9992ad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
  .topbar{background:linear-gradient(120deg,var(--accent),var(--accent-dark));color:#fff;padding:18px 16px 24px;
    border-radius:0 0 24px 24px;box-shadow:0 12px 30px -14px var(--accent-glow)}
  .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
  .logo .dot{width:9px;height:9px;background:#fff;border-radius:50%;}
  .topbar p{font-size:12.5px;opacity:.9;margin-top:4px}

  .wrap{max-width:480px;margin:0 auto;padding:0 14px}
  .status-msg{margin-top:16px;text-align:center;font-size:13px;color:var(--text-mute);padding:20px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 8px 20px -14px rgba(0,0,0,.15);position:relative}
  .pimg{height:100px;background:linear-gradient(135deg,#ece7f9,#f7f5fb);display:flex;align-items:center;
    justify-content:center;font-size:34px;overflow:hidden}
  .pimg img{width:100%;height:100%;object-fit:cover}
  .pinfo{padding:10px 11px 12px}
  .pname{font-size:12.5px;font-weight:700;line-height:1.3}
  .pdesc{font-size:10.5px;color:var(--text-mute);margin-top:3px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
  .pprice{font-size:13px;font-weight:800;color:var(--accent-dark)}
  .addbtn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;border:none;
    font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qty-badge{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:10.5px;
    font-weight:800;padding:2px 8px;border-radius:20px;z-index:2}

  .cart-bar{position:fixed;bottom:16px;left:14px;right:14px;max-width:452px;margin:0 auto;
    background:linear-gradient(120deg,var(--accent),var(--accent-dark));color:#fff;border-radius:16px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
    box-shadow:0 16px 32px -14px var(--accent-glow);display:none}
  .cart-l{font-size:12.5px;opacity:.9}
  .cart-r{font-size:14px;font-weight:800}

  /* شاشة إتمام الطلب */
  .checkout-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:16px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-dark);
    background:#fff;border:1px solid var(--line);padding:9px 15px;border-radius:11px;margin-bottom:16px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;
    box-shadow:0 10px 25px -16px rgba(0,0,0,.15)}
  .sec-title{font-size:13.5px;font-weight:800;margin-bottom:12px}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;
    border-bottom:1px solid var(--line)}
  .item-row:last-of-type{border-bottom:none}
  .total-row{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
  .total-label{font-size:13px;font-weight:800}
  .total-val{font-size:16px;font-weight:800;color:var(--accent-dark)}
  label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin:12px 0 6px}
  label:first-of-type{margin-top:0}
  input,textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
    font-size:14.5px;font-family:inherit;background:var(--bg);color:var(--text)}
  .hint{font-size:10.5px;color:var(--text-mute);margin-top:5px}
  .submit-btn{width:100%;margin-top:6px;background:linear-gradient(120deg,var(--accent),var(--accent-dark));
    color:#fff;border:none;padding:17px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 16px 30px -14px var(--accent-glow)}
  .submit-btn:disabled{opacity:.6;cursor:default}
  .msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:13px;text-align:center;font-weight:700}
  .msg.success{background:rgba(31,157,84,.1);color:var(--green);display:block}
  .msg.error{background:rgba(214,61,51,.1);color:var(--danger);display:block}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo"><span class="dot"></span> Pipely</div>
    <p>متجر أحمد للإلكترونيات — اطلب منتجك بسهولة</p>
  </div>
</div>

<div class="wrap">
  <div id="statusMsg" class="status-msg">🔄 جارٍ تحميل المنتجات...</div>
  <div class="grid" id="productsGrid"></div>
</div>

<div class="cart-bar" id="cartBar" onclick="openCheckout()">
  <span class="cart-l" id="cartCount">0 قطع بالسلة</span>
  <span class="cart-r" id="cartTotal">0 د.ع ‹ إتمام الطلب</span>
</div>

<!-- شاشة إتمام الطلب -->
<div class="checkout-overlay" id="checkoutOverlay">
  <div class="wrap">
    <div class="back" onclick="closeCheckout()">‹ رجوع للمتجر</div>

    <div class="card">
      <div class="sec-title">🛒 ملخص طلبك</div>
      <div id="checkoutItems"></div>
      <div class="total-row">
        <span class="total-label">المجموع</span>
        <span class="total-val" id="checkoutTotal">0 د.ع</span>
      </div>
    </div>

    <div class="card">
      <div class="sec-title">📋 بياناتك</div>
      <label for="cName">الاسم الكامل</label>
      <input type="text" id="cName" placeholder="مثال: علي حسين">
      <label for="cPhone">رقم الهاتف</label>
      <input type="tel" id="cPhone" placeholder="07xxxxxxxxx">
      <label for="cAddress">العنوان (للتوصيل)</label>
      <textarea id="cAddress" rows="2" placeholder="المحافظة، المنطقة، أقرب نقطة دالّة..."></textarea>
      <label for="cNotes">ملاحظات (اختياري)</label>
      <textarea id="cNotes" rows="2" placeholder="أي تفاصيل إضافية عن طلبك..."></textarea>
      <p class="hint">الدفع عند الاستلام — بنتواصل وياك لتأكيد الطلب</p>
    </div>

    <button class="submit-btn" id="submitOrderBtn" onclick="submitOrder()">✅ تأكيد الطلب</button>
    <div class="msg" id="orderMsg"></div>
  </div>
</div>

<script>
  // ⚠️ عدّل هذا الرابط ليطابق رابط الـWorker الحقيقي مالتك بالضبط
  const API_URL = 'https://pipely-api.mustafa-mo-hussain.workers.dev';

  let products = [];
  let cart = {}; // { productId: { product, quantity } }

  function loadProducts() {
    fetch(API_URL + '/products')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        const status = document.getElementById('statusMsg');
        if (data.result !== 'success' || !data.products || data.products.length === 0) {
          status.textContent = 'ماكو منتجات متوفرة حاليًا';
          return;
        }
        status.style.display = 'none';
        products = data.products;
        renderProducts();
      })
      .catch(function () {
        document.getElementById('statusMsg').textContent = 'تعذر الاتصال بالمتجر، حاول لاحقًا';
      });
  }

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';
    products.forEach(function (p) {
      const inCart = cart[p.id];
      const card = document.createElement('div');
      card.className = 'pcard';
      card.innerHTML =
        (inCart ? '<span class="qty-badge">×' + inCart.quantity + '</span>' : '') +
        '<div class="pimg">' + (p.image ? '<img src="' + p.image + '" alt="">' : '📦') + '</div>' +
        '<div class="pinfo">' +
        '<div class="pname">' + (p.name || 'منتج') + '</div>' +
        '<div class="pdesc">' + (p.description || '') + '</div>' +
        '<div class="prow"><span class="pprice">' + Number(p.price || 0).toLocaleString() + ' د.ع</span>' +
        '<button class="addbtn" onclick="addToCart(' + p.id + ')">+</button></div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  function addToCart(productId) {
    const product = products.find(function (p) { return p.id === productId; });
    if (!product) return;
    if (!cart[productId]) cart[productId] = { product: product, quantity: 0 };
    cart[productId].quantity++;
    renderProducts();
    updateCartBar();
  }

  function updateCartBar() {
    const bar = document.getElementById('cartBar');
    const items = Object.values(cart);
    const count = items.reduce(function (s, i) { return s + i.quantity; }, 0);
    const total = items.reduce(function (s, i) { return s + i.quantity * (i.product.price || 0); }, 0);
    if (count === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('cartCount').textContent = count + ' قطع بالسلة';
    document.getElementById('cartTotal').textContent = total.toLocaleString() + ' د.ع ‹ إتمام الطلب';
  }

  function openCheckout() {
    const itemsBox = document.getElementById('checkoutItems');
    itemsBox.innerHTML = '';
    let total = 0;
    Object.values(cart).forEach(function (item) {
      const lineTotal = item.quantity * (item.product.price || 0);
      total += lineTotal;
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = '<span>' + item.product.name + ' <span style="color:var(--text-mute);font-size:11px;">× ' + item.quantity + '</span></span>' +
        '<span style="font-weight:700;">' + lineTotal.toLocaleString() + ' د.ع</span>';
      itemsBox.appendChild(row);
    });
    document.getElementById('checkoutTotal').textContent = total.toLocaleString() + ' د.ع';
    document.getElementById('orderMsg').style.display = 'none';
    document.getElementById('checkoutOverlay').style.display = 'block';
  }

  function closeCheckout() {
    document.getElementById('checkoutOverlay').style.display = 'none';
  }

  function submitOrder() {
    const name = document.getElementById('cName').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const address = document.getElementById('cAddress').value.trim();
    const notes = document.getElementById('cNotes').value.trim();
    const msg = document.getElementById('orderMsg');
    const btn = document.getElementById('submitOrderBtn');

    if (!name || !phone) {
      msg.className = 'msg error';
      msg.textContent = 'الرجاء تعبئة الاسم ورقم الهاتف';
      msg.style.display = 'block';
      return;
    }

    const items = Object.values(cart).map(function (item) {
      return { productId: item.product.id, productName: item.product.name, price: item.product.price, quantity: item.quantity };
    });

    btn.disabled = true;
    btn.textContent = 'جارٍ الإرسال...';

    fetch(API_URL + '/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerName: name, phone: phone, address: address, notes: notes, items: items })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = '✅ تأكيد الطلب';
        if (data.result === 'success') {
          msg.className = 'msg success';
          msg.textContent = '🎉 تم استلام طلبك بنجاح! بنتواصل وياك قريبًا.';
          msg.style.display = 'block';
          cart = {};
          updateCartBar();
          setTimeout(function () {
            closeCheckout();
            renderProducts();
          }, 2000);
        } else {
          msg.className = 'msg error';
          msg.textContent = 'حدث خطأ: ' + (data.error || 'حاول مرة ثانية');
          msg.style.display = 'block';
        }
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = '✅ تأكيد الطلب';
        msg.className = 'msg error';
        msg.textContent = 'تعذر الاتصال، تأكد من الإنترنت وحاول مرة ثانية';
        msg.style.display = 'block';
      });
  }

  loadProducts();
</script>
</body>
</html>
